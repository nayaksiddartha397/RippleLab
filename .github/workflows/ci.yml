name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  web-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:contracts
      - run: pnpm check:web
      - run: pnpm check:secrets

  economic-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.19
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --project services/economic-engine --locked --dev
      - run: uv run --project services/economic-engine ruff check services/economic-engine
      - run: uv run --project services/economic-engine ruff format --check services/economic-engine
      - run: uv run --project services/economic-engine pytest services/economic-engine/tests
